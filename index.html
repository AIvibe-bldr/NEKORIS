<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ねこチェイス">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>ねこハウスチェイス</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14110f; color: #fff;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  #stats { display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 190px); }
  #stats span { background: rgba(20, 16, 12, .62); border: 1px solid rgba(255, 255, 255, .14); border-radius: 999px; padding: 5px 12px;
    font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #map { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 170px; height: 119px;
    border-radius: 10px; border: 1px solid rgba(255, 255, 255, .2); background: rgba(20, 16, 12, .6); }
  #stam { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(240px, 44vw); height: 9px;
    border-radius: 9px; background: rgba(20, 16, 12, .6); border: 1px solid rgba(255, 255, 255, .22); overflow: hidden; }
  #stam i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ffb13d, #ffe27a); transform-origin: left; }
  #stam.tired i { background: #d6523f; }
  #msg { position: absolute; left: 50%; top: 36%; transform: translateX(-50%); font-size: clamp(18px, 3.4vw, 30px); font-weight: 800;
    text-shadow: 0 2px 10px rgba(0, 0, 0, .8); opacity: 0; transition: opacity .25s; width: max-content; max-width: 88vw; text-align: center; text-wrap: balance; }
  #msg.on { opacity: 1; }
  #flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(transparent 35%, rgba(220, 30, 20, .75)); opacity: 0; transition: opacity .5s; }
  #flash.on { opacity: 1; transition: none; }

  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.touch.playing #touch { display: block; }
  #stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35);
    background: rgba(255, 255, 255, .08); left: 96px; bottom: 96px; top: auto; opacity: .55; }
  #stick.fixed { margin-bottom: -60px; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: rgba(255, 255, 255, .55); }
  .tb { position: absolute; pointer-events: auto; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .45); background: rgba(20, 16, 12, .45);
    color: #fff; font: 700 14px/1 inherit; font-family: inherit; touch-action: none; }
  .tb.on { background: rgba(255, 190, 80, .6); }
  #bJump { width: 86px; height: 86px; right: max(22px, env(safe-area-inset-right)); bottom: max(46px, calc(env(safe-area-inset-bottom) + 30px)); }
  #bDash { width: 72px; height: 72px; right: max(118px, calc(env(safe-area-inset-right) + 100px)); bottom: max(30px, calc(env(safe-area-inset-bottom) + 14px)); }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(rgba(20, 14, 8, .35), rgba(10, 7, 4, .82)); transition: opacity .3s; }
  #overlay.hide { opacity: 0; pointer-events: none; }
  #panel { max-width: 560px; width: 100%; max-height: 100%; overflow: auto; text-align: center; padding: 26px 24px; border-radius: 22px;
    background: rgba(28, 22, 16, .78); border: 1px solid rgba(255, 255, 255, .16); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-sizing: border-box; }
  #panel h1 { margin: 0 0 6px; font-size: clamp(26px, 6vw, 44px); letter-spacing: .04em; color: #ffd27a; text-wrap: balance; }
  #panel p { margin: 8px 0; line-height: 1.7; font-size: 15px; color: #f1e8da; }
  #panel ul { text-align: left; margin: 12px auto; padding: 0; list-style: none; font-size: 14px; line-height: 1.75; color: #e8dccb; max-width: 440px; }
  #panel li { padding-left: 1.9em; text-indent: -1.9em; }
  #panel kbd { background: rgba(255, 255, 255, .14); border-radius: 5px; padding: 1px 6px; font: 600 12px/1.6 ui-monospace, monospace; }
  #oBtn { margin-top: 14px; pointer-events: auto; border: 0; border-radius: 999px; padding: 14px 44px; font: 800 19px/1 inherit; font-family: inherit;
    color: #2a1a08; background: linear-gradient(#ffd98a, #ffb13d); box-shadow: 0 6px 20px rgba(255, 170, 50, .35); cursor: pointer; }
  #oBtn:active { transform: translateY(2px); }
  @media (max-height: 460px) { #panel { padding: 14px 18px; } #panel ul { font-size: 12.5px; line-height: 1.55; margin: 6px auto; } #panel p { margin: 4px 0; font-size: 13px; } #oBtn { margin-top: 8px; padding: 11px 36px; } }
  @media (orientation: portrait) { #stick { bottom: 130px; } #bJump { bottom: max(96px, calc(env(safe-area-inset-bottom) + 80px)); } #bDash { bottom: max(80px, calc(env(safe-area-inset-bottom) + 64px)); } #stam { bottom: max(34px, calc(env(safe-area-inset-bottom) + 18px)); } #msg { top: 26%; } }
  @media (max-width: 520px) { #map { width: 120px; height: 84px; } #stats { max-width: calc(100% - 136px); } #stats span { font-size: 13px; padding: 4px 9px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="stats"><span id="sLives"></span><span id="sMice"></span><span id="sScore"></span><span id="sLvl"></span></div>
  <canvas id="map" width="340" height="238"></canvas>
  <div id="stam"><i></i></div>
  <div id="msg"></div>
</div>
<div id="flash"></div>
<div id="touch">
  <div id="stick"><i></i></div>
  <button class="tb" id="bDash">ダッシュ</button>
  <button class="tb" id="bJump">ジャンプ</button>
</div>
<div id="overlay"><div id="panel">
  <h1 id="oTitle">ねこハウスチェイス</h1>
  <div id="oBody"></div>
  <button id="oBtn">スタート</button>
</div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
